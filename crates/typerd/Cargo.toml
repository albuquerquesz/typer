[package]
name = "typerd"
description = "typer daemon: global keyboard capture and mechanical keyboard sounds"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
typer-core.workspace = true
serde_json.workspace = true
anyhow.workspace = true
cpal = "0.15"
evdev = "0.12"
inotify = { version = "0.11", default-features = false }
rtrb = "0.3"
signal-hook = "0.3"
symphonia = { version = "0.5", default-features = false, features = ["ogg", "vorbis", "wav", "pcm", "mp3", "flac"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
